name: test

# Trigger when a push occurs on main or develop
# Also allows this workflow to be called by other workflows
on:
  workflow_call:
  push:
    branches:
      - main
      - develop

jobs:
  # Build and Test Job
  # This job runs on every push to main or develop
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            machine: linux
            arch: x64
          - os: windows-latest
            machine: win
            arch: x64

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build the solution
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests with report
        run: dotnet test --configuration Release --no-build
