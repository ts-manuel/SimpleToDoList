# This workflow gets triggered when a tag is pushed on the main branch.
# It creates a new release with the version from the tag.
# It uses the CI workflow to build and package the project.
# The result is a new release with the packaged artifacts attached.

name: Release
on:
  push:
    tags:
      - v*
jobs:
  ci:
    name: Continuous Integration
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.ci.outputs.version }}
        run: gh release create "$TAG" -t "$VERSION" --notes-from-tag

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package.*
          path: packages
          merge-multiple: true

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" packages/*
