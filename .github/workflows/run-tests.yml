name: develop-tests

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ./SimpleToDoList.sln

      - name: Build the solution
        run: dotnet build ./SimpleToDoList.sln --configuration Release --no-restore 

      - name: Run unit tests with report
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=TestResults.trx"
        
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: Test Results
          path: ./tests/SimpleToDoListTests/TestResults/TestResults.trx